services:
  openclaw:
    image: openclaw:latest
    container_name: openclaw_bot
    restart: always
    ports:
      - "18789:18789" # Gateway Port
      - "18790:18790" # Bridge Port
      - "3000:3000" # Web UI Port
      - "2222:22" # SSH Port (Lưu ý: Map ra 2222 vì 22 thường bị hệ thống chiếm)
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
      - ./gogcli-config:/home/node/.config/gogcli
    environment:
      - NODE_ENV=production
      - OPENCLAW_STORAGE_PATH=/home/node/.openclaw
      - GOG_KEYRING_BACKEND=${GOG_KEYRING_BACKEND}
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_BASE_URL=${N8N_BASE_URL}
    env_file:
      - .env
    # Cấp quyền tối cao cho container để chạy được các lệnh hệ thống
    privileged: true

networks:
  default:
    name: openclaw_network
